<div appAnimateOnClick [behaviour]="'pulse'" class="w-full bg-white p-5 flex flex-col rounded-[20px] box-shadow" (click)="goToGreenhouse(greenhouseInfo().id)">
  <img src="assets/images/defaults/{{greenhouseInfo().cover}}" [alt]="greenhouseInfo().name"
       class="w-full h-[150px] object-cover rounded-[20px] mb-5"/>
  <div class="flex flex-row items-center justify-between">
    <div class="flex flex-col items-start">
      <se-title size="text-[20px] tracking-tight" weight="font-medium" color="text-black">{{ greenhouseInfo().name }}
      </se-title>
      <se-location-label [location]="greenhouseInfo().location"/>
    </div>
    <se-badge>
      {{ greenhouseInfo().plants }}
      <se-title color="text-se-jungle" weight="font-light" size="text-[16px] ml-2">Plants</se-title>
    </se-badge>
  </div>
</div>
