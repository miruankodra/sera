<div class="w-full p-5 flex flex-col rounded-[20px] box-shadow" (click)="goToGreenhouse(0)">
  <img src="assets/images/defaults/{{image()}}" [alt]="name()"
       class="w-full h-[150px] object-cover rounded-[20px] mb-5"/>
  <div class="flex flex-row items-center justify-between">
    <div class="flex flex-col items-start">
      <se-title size="text-[22px] tracking-wide" weight="font-normal" color="text-black">{{ name() }}</se-title>
      <se-location-label [location]="location()"/>
    </div>
    <se-badge>
      {{ plants() }}
      <se-title color="text-se-jungle" weight="font-light" size="text-[16px] ml-2">Plants</se-title>
    </se-badge>
  </div>
</div>
