services:
  app:
    build:
      context: ./api
      dockerfile: ../docker/php/Dockerfile
    image: sera-app
    volumes:
      - ./api:/var/www
    env_file:
      - ./api/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sera

  nginx:
    image: nginx:alpine
    ports:
      - "8100:80"
    volumes:
      - ./api/public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sera

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sera

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sera

  queue:
    image: sera-app
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./api:/var/www
    env_file:
      - ./api/.env
    environment:
      REVERB_HOST: reverb
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sera

  reverb:
    image: sera-app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    ports:
      - "8080:8080"
    volumes:
      - ./api:/var/www
    env_file:
      - ./api/.env
    depends_on:
      app:
        condition: service_started
    networks:
      - sera

volumes:
  mysql_data:
  redis_data:

networks:
  sera:
    driver: bridge
