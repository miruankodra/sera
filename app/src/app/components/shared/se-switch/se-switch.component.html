<div class="flex flex-row items-center justify-start gap-3">

  <div
    class="transition-colors duration-300 ease-in relative w-[40px] h-[20px] rounded-full flex items-center cursor-pointer"
    [class]="isChecked() ? 'bg-se-jungle' : 'bg-gray-100'"
    (click)="toggleSwitch()">
    <div
      class="transition-transform ease-linear duration-150 size-[25px] rounded-full bg-white transform"
      [class]="isChecked() ? 'translate-x-[15px]' : 'translate-x-[0px] bg-gray-300'">
    </div>
  </div>

  @if (label() && label() !== '') {
    <se-title [size]="labelSize()" [weight]="labelWeight()" [color]="labelColor()"
              (click)="toggleSwitch()">{{ label() }}
    </se-title>
  }
</div>
