<div class="w-full">
  <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Today</p>
  <div class="flex gap-2 overflow-x-auto pb-1 today-strip">
    @if (tasks().length === 0) {
      <span class="text-sm text-gray-300 italic">No tasks today</span>
    } @else {
      @for (task of tasks(); track task.id) {
        <button
          class="flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-medium transition-colors
                 {{ task.type === 'reminder'
                    ? 'bg-blue-50 border-blue-200 text-blue-700 hover:bg-blue-100'
                    : 'bg-emerald-50 border-emerald-200 text-emerald-700 hover:bg-emerald-100' }}"
          (click)="taskSelected.emit(task.id)">
          <lucide-icon [img]="task.type === 'reminder' ? BellIcon : ZapIcon" [size]="11"/>
          <span class="whitespace-nowrap">{{ task.title }}</span>
        </button>
      }
    }
  </div>
</div>
