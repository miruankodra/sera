<se-card width="w-full" height="aspect-square p-5 py-3 transition-colors cursor-pointer"
         bgColor="bg-white"
         border="border-2 border-gray-100"
         (click)="openActionSheet()">
  <div class="w-full h-1/2 flex flex-row items-center justify-between">
    <div class="w-[44px] aspect-square rounded-full flex items-center justify-center p-2.5 {{ iconBg() }}">
      <lucide-icon [img]="icon()" class="{{ iconColor() }}" [size]="22"/>
    </div>
    @if (value()) {
      <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full">
        {{ value() }} {{ unit() }}
      </span>
    } @else {
      <span class="text-xs font-medium text-gray-300">Not set</span>
    }
  </div>
  <div class="w-full h-1/2 flex flex-col items-start justify-end gap-0.5">
    <se-title size="text-[20px]" weight="font-bold" color="text-se-green">{{ title() }}</se-title>
    <se-title size="text-[13px]" weight="font-light" color="text-gray-400">Tap to configure</se-title>
  </div>
</se-card>

<!-- Web action sheet -->
@if (showMenu()) {
  <div class="fixed inset-0 z-50 flex items-end justify-center bg-black/40"
       (click)="showMenu.set(false)">
    <div class="bg-white w-full max-w-md rounded-t-2xl pb-8 shadow-xl overflow-hidden"
         (click)="$event.stopPropagation()">
      <div class="px-6 pt-5 pb-3 border-b border-gray-100">
        <p class="font-semibold text-se-green text-base">{{ title() }}</p>
        <p class="text-sm text-gray-400 mt-0.5">
          {{ value() ? 'Current threshold: ' + value() + ' ' + unit() : 'No threshold set' }}
        </p>
      </div>
      <button class="w-full px-6 py-4 text-left text-se-green font-medium hover:bg-gray-50 transition-colors"
              (click)="openEditModal()">Edit Threshold</button>
      <button class="w-full px-6 py-4 text-left text-red-500 font-medium hover:bg-gray-50 transition-colors"
              (click)="clearValue()">Clear Threshold</button>
      <button class="w-full px-6 py-4 text-left text-gray-400 font-medium hover:bg-gray-50 transition-colors"
              (click)="showMenu.set(false)">Cancel</button>
    </div>
  </div>
}

<!-- Edit modal -->
@if (showModal()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
       (click)="cancelEdit()">
    <div class="bg-white rounded-2xl p-6 w-72 shadow-xl flex flex-col gap-4"
         (click)="$event.stopPropagation()">
      <p class="text-se-green font-semibold text-base">Set {{ title() }}</p>
      <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-4 py-2">
        <input
          type="number"
          class="flex-1 outline-none text-se-green font-medium text-lg bg-transparent"
          placeholder="Enter value"
          [ngModel]="inputValue()" (ngModelChange)="inputValue.set($event)"
          (keyup.enter)="confirmEdit()"
          autofocus
        />
        @if (unit()) {
          <span class="text-gray-400 text-sm">{{ unit() }}</span>
        }
      </div>
      <div class="flex gap-3">
        <button class="flex-1 py-2 rounded-xl border border-gray-200 text-gray-500 text-sm font-medium"
                (click)="cancelEdit()">Cancel</button>
        <button class="flex-1 py-2 rounded-xl bg-se-green text-se-lime text-sm font-semibold"
                (click)="confirmEdit()">Confirm</button>
      </div>
    </div>
  </div>
}
