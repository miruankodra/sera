<div class="w-full h-full flex flex-col items-center">
  <div class="w-full mb-8">
    <se-greenhouse-header [showBackButton]="true" [showMenuButton]="true"/>
    <se-greenhouse-info [greenhouse]="greenhouse()"></se-greenhouse-info>
  </div>
  <div class="w-full">
    <se-statistics-card [statistics]="stats"/>
    <se-tab-panel>
      <se-panel-tab title="Manual Control">
        <div class="w-full flex flex-wrap items-center justify-between gap-x-3 gap-y-5">
          <div class="w-[48%]">
            <se-control-card title="Lighting" subtitle="12 Watt" [initState]="false" onIcon="bulb.svg"
                           offIcon="bulb-outline.svg"/>
          </div>
          <div class="w-[48%]">
            <se-control-card title="Lighting" subtitle="12 Watt" [initState]="false" onIcon="bulb.svg"
                           offIcon="bulb-outline.svg"/>
          </div>
          <div class="w-[48%]">
            <se-control-card title="Lighting" subtitle="12 Watt" [initState]="false" onIcon="bulb.svg"
                           offIcon="bulb-outline.svg"/>
          </div>
          <div class="w-[48%]">
            <se-control-card title="Lighting" subtitle="12 Watt" [initState]="false" onIcon="bulb.svg"
                           offIcon="bulb-outline.svg"/>
          </div>
        </div>
      </se-panel-tab>

      <se-panel-tab title="Smart Greenhouse">
        <div class="w-full flex flex-wrap items-center justify-between gap-x-3 gap-y-5">
          <div class="w-[48%]">
            <se-threshold-card
              title="Temperature" unit="°C"
              [icon]="ThermometerIcon"
              iconColor="text-orange-500" iconBg="bg-orange-100"
              [(value)]="temperature"/>
          </div>
          <div class="w-[48%]">
            <se-threshold-card
              title="Humidity" unit="%"
              [icon]="DropletsIcon"
              iconColor="text-blue-500" iconBg="bg-blue-100"
              [(value)]="humidity"/>
          </div>
          <div class="w-[48%]">
            <se-threshold-card
              title="Soil Moisture" unit="%"
              [icon]="SproutIcon"
              iconColor="text-green-600" iconBg="bg-green-100"
              [(value)]="soilMoisture"/>
          </div>
          <div class="w-[48%]">
            <se-threshold-card
              title="CO₂ Level" unit="ppm"
              [icon]="WindIcon"
              iconColor="text-teal-600" iconBg="bg-teal-100"
              [(value)]="co2"/>
          </div>
        </div>
      </se-panel-tab>
    </se-tab-panel>
  </div>
</div>
