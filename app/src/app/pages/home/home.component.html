<div class="relative w-full h-screen flex flex-col items-center overflow-scroll px-5 pt-40 pb-[80px] snap-mandatory snap-y" (scroll)="fadeIOHeader($event)">
  <div class="fixed top-[-100px] w-[100vh] rounded-[100%] h-[400px] bg-se-green z-0"></div>
  <div #header class="transition-all ease-linear fixed top-8 left-5 w-full h-[150px] flex flex-col items-start justify-start">
    <se-welcome-header [username]="username()"/>
    <se-date/>
  </div>

  @if (loading()) {
    @for (i of [1,2,3]; track i) {
      <div class="relative z-50 w-full snap-normal snap-center mb-5">
        <div class="w-full bg-white p-5 rounded-[20px] animate-pulse">
          <div class="w-full h-[150px] bg-gray-200 rounded-[20px] mb-5"></div>
          <div class="h-5 bg-gray-200 rounded w-2/3 mb-2"></div>
          <div class="h-4 bg-gray-100 rounded w-1/3"></div>
        </div>
      </div>
    }
  } @else {
    @for (greenhouse of greenhouses(); track greenhouse.id) {
      <div class="relative z-50 w-full snap-normal snap-center mb-5">
        <se-greenhouse-card [greenhouseInfo]="greenhouse"/>
      </div>
    }
    @if (greenhouses().length === 0) {
      <div class="relative z-50 w-full flex flex-col items-center justify-center mt-10">
        <p class="text-gray-400 text-[16px]">You have no greenhouses yet.</p>
      </div>
    }
  }
</div>
